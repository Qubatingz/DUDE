# Builds Dude for Windows on GitHub's machines every time the code changes.
# Download: Actions tab > newest "Build Dude for Windows" run > Artifacts > Dude-for-Windows.
name: Build Dude for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the icon tool
        run: npm install --no-save --no-package-lock resedit
      - name: Build Dude
        run: bash build-windows.sh
      - name: Check he can read files to learn (Word, PDF)
        run: node ci/learn-smoke.js dist/Dude/resources/app
      - name: Upload Dude
        uses: actions/upload-artifact@v4
        with:
          name: Dude-for-Windows
          path: dist/Dude/
          retention-days: 90
          compression-level: 9

  # Dude's voice engine is a Windows program: check on a real Windows machine that it loads and can talk.
  voice-check:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Dude-for-Windows
          path: dude
      - name: Check "My voice" on Windows
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath ".\dude\Dude.exe" -ArgumentList @("ci\voice-smoke.js", ".\dude\resources\app") -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Give the voice engine the Windows parts it needs (Visual C++ runtime)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath ".\dude\Dude.exe" -ArgumentList @("ci\pe-imports.js", ".\dude\resources\app\node_modules\sherpa-onnx-win-x64", "--copy-vc-runtime") -Wait -PassThru -NoNewWindow -RedirectStandardOutput pe.txt -RedirectStandardError pe-err.txt
          Get-Content pe.txt, pe-err.txt
          $msg = (Get-Content pe.txt | Select-String "Visual C\+\+|No Visual") -join " "
          Write-Output "::notice title=Engine parts::$msg"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Check "Dude's voice" (voice 1) on Windows, and how fast it talks
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath ".\dude\Dude.exe" -ArgumentList @("ci\dudevoice-smoke.js", ".\dude\resources\app") -Wait -PassThru -NoNewWindow -RedirectStandardOutput out2.txt -RedirectStandardError err2.txt
          Get-Content out2.txt, err2.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Run Dude himself - downloads and unpacks his voice and ears himself, talks, hears a recording, loads his page
        shell: pwsh
        run: |
          $env:DUDE_SELFTEST = "$PWD\selftest.json"
          $env:DUDE_SELFTEST_WAV = "$PWD\ci\fixtures\dude-today.wav"
          # unpack with Dude's own unzip tool (what Windows 10 needs), not this Windows' tar.exe
          $env:DUDE_UNPACK = "js"
          $p = Start-Process -FilePath ".\dude\Dude.exe" -PassThru
          if (-not $p.WaitForExit(1500000)) { $p.Kill(); "Dude did not finish in 25 minutes" }
          if (-not (Test-Path selftest.json)) { "no result"; exit 1 }
          Get-Content selftest.json
          $r = Get-Content selftest.json -Raw | ConvertFrom-Json
          Write-Output "::notice title=Dude's voice::$($r.voice.state) in $($r.voice.secs) s, $($r.voice.rtf) s per second of speech $($r.voice.error)"
          Write-Output "::notice title=Dude's ears::$($r.ears.state) in $($r.ears.secs) s, $($r.ears.rtf) s per sentence, heard: $($r.earsHeard -join ' / ') $($r.ears.error)"
          Write-Output "::notice title=Dude's page::loaded $($r.page.dude), errors: $($r.page.errors.Count) $($r.page.errors -join ' | ')"
          if (-not $r.ok) { exit 1 }
      - name: A new Dude takes over from an old one that is still running
        shell: pwsh
        run: |
          Copy-Item -Recurse dude dude-old
          $pj = "dude-old\resources\app\package.json"
          (Get-Content $pj -Raw) -replace '"version": "[^"]+"', '"version": "1.6.0"' | Set-Content $pj
          $fail = 0
          # 1: an old Dude (1.7 and before) that doesn't step aside: the new one closes it
          # 2: a Dude that does step aside by himself (1.7.1 and later)
          foreach ($case in @("old Dude that holds on", "Dude that steps aside")) {
            if ($case -like "old*") { $env:DUDE_TEST_OLD = "1" } else { Remove-Item Env:DUDE_TEST_OLD -ErrorAction SilentlyContinue }
            $null = Start-Process -FilePath ".\dude-old\Dude.exe" -PassThru
            Start-Sleep 15
            Remove-Item Env:DUDE_TEST_OLD -ErrorAction SilentlyContinue
            $null = Start-Process -FilePath ".\dude\Dude.exe" -PassThru
            Start-Sleep 25
            $left = @(Get-CimInstance Win32_Process -Filter "Name='Dude.exe'" | Select-Object ProcessId, ParentProcessId, ExecutablePath)
            $left | Format-Table -AutoSize | Out-String -Width 300 | Write-Output
            $oldLeft = @($left | Where-Object { $_.ExecutablePath -like "*dude-old*" }).Count
            $newLeft = @($left | Where-Object { $_.ExecutablePath -and $_.ExecutablePath -notlike "*dude-old*" }).Count
            Get-Content "$env:APPDATA\Dude\dude-log.txt" -Tail 8 -ErrorAction SilentlyContinue
            Get-Process Dude -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 3
            Write-Output "::notice title=Takes over from an $case::old Dude processes left: $oldLeft, new Dude processes: $newLeft"
            if ($oldLeft -ne 0 -or $newLeft -eq 0) { $fail = 1 }
          }
          Remove-Item -Recurse -Force dude-old -ErrorAction SilentlyContinue
          exit $fail
      - name: Check the listening scripts start on Windows
        shell: powershell
        run: |
          foreach ($f in @("listen.ps1", "hear.ps1")) { $null = [ScriptBlock]::Create((Get-Content ".\dude\resources\app\$f" -Raw)); "$f parses" }
          # this machine has no microphone, so hear.ps1 should say so (or that no recognizer is installed) and stop
          $p = Start-Process -FilePath "powershell.exe" -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\dude\resources\app\hear.ps1", "$env:TEMP\dude-pause-test") -PassThru -NoNewWindow -RedirectStandardOutput hear.txt
          if (-not $p.WaitForExit(30000)) { $p.Kill(); "hear.ps1 kept running (it found a microphone)" }
          $out = Get-Content hear.txt -Raw; "hear.ps1 said: $out"
          if ($out -notmatch "READY|ERR:") { exit 1 }
      - name: Upload Dude (with the Windows parts)
        uses: actions/upload-artifact@v4
        with:
          name: Dude-for-Windows
          path: dude/
          retention-days: 90
          compression-level: 9
          overwrite: true
